<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nossa camada sobre AI Memory</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:#0f151d;color:#fff;font-family:"Segoe UI",sans-serif}svg{display:block;width:100%;height:auto}g.node{cursor:pointer}g.node:hover rect,g.node:focus rect,g.node.active rect{stroke:#4A90D9;stroke-width:4}g.node:focus{outline:none}path[data-from].lit{stroke:#4A90D9;stroke-width:4}@media(prefers-reduced-motion:reduce){*{transition:none}}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="nossa-camada-title nossa-camada-desc"><title id="nossa-camada-title">Nossa camada sobre AI Memory</title><desc id="nossa-camada-desc">Regras, integração e operação adotam o projeto original, sem novo banco ou fork comprovado.</desc><defs><marker id="nossa-camada-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#91a5ba"/></marker></defs><rect width="1040" height="640" fill="#0f151d"/><path data-from="rules" data-to="codex" d="M304 100H368" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="rules" data-to="claude" d="M172 144V284Q172 292 180 292H368" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="codex" data-to="bridge" d="M632 100H696" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="claude" data-to="bridge" d="M632 292H640Q648 292 648 284V128Q648 120 656 120H696" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="bridge" data-to="server" d="M828 144V248" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="server" data-to="shared-wiki" d="M828 336V440" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="operations" data-to="server" d="M632 484H656Q664 484 664 476V300Q664 292 672 292H696" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="operations" data-to="shared-wiki" d="M632 484H696" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><g class="node" id="nossa-camada-rules" data-key="rules" tabindex="0" role="button" aria-label="Regras de uso"><title>Orientam consulta, escopo explícito quando necessário e registro de conhecimento durável com links. São instruções para o agente, não execução automática.</title><rect x="40" y="56" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="92" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Regras de uso</text><text x="60" y="120" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">AGENTS.md / CLAUDE.md</text></g><g class="node" id="nossa-camada-codex" data-key="codex" tabindex="0" role="button" aria-label="Codex"><title>Cliente da memória. MCP conectado, confiança dos hooks e captura efetiva exigem verificações distintas.</title><rect x="368" y="56" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="388" y="92" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Codex</text><text x="388" y="120" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Cliente conectado</text></g><g class="node" id="nossa-camada-bridge" data-key="bridge" tabindex="0" role="button" aria-label="MCP e integração"><title>Integra clientes ao servidor existente. A bridge não instala nem inicia o servidor.</title><rect x="696" y="56" width="264" height="88" rx="8" fill="#172b40" stroke="#4A90D9" stroke-width="2"/><text x="716" y="92" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">MCP e integração</text><text x="716" y="120" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Conexão autorizada</text></g><g class="node" id="nossa-camada-claude" data-key="claude" tabindex="0" role="button" aria-label="Claude Code"><title>Cliente da mesma memória. Existe opt-out documentado da captura de prompts; não assumir captura completa.</title><rect x="368" y="248" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="388" y="284" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Claude Code</text><text x="388" y="312" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Cliente conectado</text></g><g class="node" id="nossa-camada-server" data-key="server" tabindex="0" role="button" aria-label="AI Memory original"><title>Binário original operado em VM Linux. Se hospedado no PC, depende da disponibilidade do PC e VM; VPS é alternativa de hospedagem.</title><rect x="696" y="248" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="716" y="284" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">AI Memory original</text><text x="716" y="312" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Servidor existente</text></g><g class="node" id="nossa-camada-operations" data-key="operations" tabindex="0" role="button" aria-label="Saúde e backup"><title>Operação mantém saúde e recuperação. Rotina existente não comprova captura total, aprendizado generativo ou restauração atual. Esta rodada não executou vigia, backup ou restore.</title><rect x="368" y="440" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="388" y="476" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Saúde e backup</text><text x="388" y="504" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Operação documentada</text></g><g class="node" id="nossa-camada-shared-wiki" data-key="shared-wiki" tabindex="0" role="button" aria-label="Wiki compartilhada"><title>Decisões, procedimentos e referências relacionados por links. Código, testes e banco atual continuam sendo fontes técnicas de verificação. Não é CRM nem cópia da conversa integral.</title><rect x="696" y="440" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="716" y="476" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Wiki compartilhada</text><text x="716" y="504" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Conteúdo autorizado</text></g><path d="M40 564H1000" stroke="#435469"/><text id="detail" x="40" y="600" fill="#d6e2ed" font-family="Segoe UI, sans-serif" font-size="20">Regras e operação adotam o original; configurações privadas ficam fora do material.</text></svg><script>const details={"rules": "Regras de uso: AGENTS.md / CLAUDE.md.", "codex": "Codex: Cliente conectado.", "bridge": "MCP e integração: Conexão autorizada.", "claude": "Claude Code: Cliente conectado.", "server": "AI Memory original: Servidor existente.", "operations": "Saúde e backup: Operação documentada.", "shared-wiki": "Wiki compartilhada: Conteúdo autorizado."};const nodes=[...document.querySelectorAll("g.node")];function focusNode(n){nodes.forEach(x=>x.classList.toggle("active",x===n));document.getElementById("detail").textContent=details[n.dataset.key];document.querySelectorAll("path[data-from]").forEach(e=>e.classList.toggle("lit",e.dataset.from===n.dataset.key||e.dataset.to===n.dataset.key));}nodes.forEach(n=>{n.addEventListener("mouseenter",()=>focusNode(n));n.addEventListener("focus",()=>focusNode(n));n.addEventListener("click",()=>focusNode(n));n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();focusNode(n);}})});</script></body></html>
