<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nossa integração no dia a dia</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;width:100%;overflow:hidden;margin:0;background:#0f151d;color:#fff;font-family:"Segoe UI",sans-serif}svg{display:block;width:100%;height:100%}g.node{cursor:pointer}g.node:hover rect,g.node:focus rect,g.node.active rect{stroke:#4A90D9;stroke-width:4}g.node:focus{outline:none}path[data-from].lit{stroke:#4A90D9;stroke-width:4}@media(prefers-reduced-motion:reduce){*{transition:none}}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="nossa-camada-title nossa-camada-desc"><title id="nossa-camada-title">Nossa integração no dia a dia</title><desc id="nossa-camada-desc">Instruções orientam Codex ou Claude Code; Project Brain fecha a sessão e a conexão leva à memória administrada pela pessoa ou empresa.</desc><defs><marker id="nossa-camada-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#91a5ba"/></marker></defs><rect width="1040" height="640" fill="#0f151d"/><text x="40" y="40" fill="#fff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600">Nossa integração no dia a dia</text><text x="40" y="72" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Instruções de uso e fechamento sobre o AI Memory</text><path data-from="rules" data-to="codex" d="M320 168H380" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="codex" data-to="bridge" d="M660 168H720" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="bridge" data-to="server" d="M860 232V344" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="codex" data-to="operations" d="M520 232V344" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="operations" data-to="server" d="M660 408H720" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><path data-from="server" data-to="shared-wiki" d="M860 472V504Q860 512 852 512H188Q180 512 180 504V472" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#nossa-camada-arrow)"/><g class="node" id="nossa-camada-rules" data-key="rules" tabindex="0" role="button" aria-label="Instruções de uso"><title>As instruções orientam a ferramenta a consultar a memória e guardar o que precisa permanecer.</title><rect x="40" y="104" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="140" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Instruções de uso</text><text x="60" y="208" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Quando consultar e salvar</text></g><g class="node" id="nossa-camada-codex" data-key="codex" tabindex="0" role="button" aria-label="Codex ou Claude Code"><title>A pessoa usa a ferramenta que está conectada e autorizada a acessar a memória.</title><rect x="380" y="104" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="400" y="140" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Codex ou</text><text x="400" y="168" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Claude Code</text><text x="400" y="208" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Ferramenta de trabalho</text></g><g class="node" id="nossa-camada-bridge" data-key="bridge" tabindex="0" role="button" aria-label="Conexão com a memória"><title>A conexão liga a ferramenta ao servidor escolhido, respeitando o acesso configurado.</title><rect x="720" y="104" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="740" y="140" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Conexão com</text><text x="740" y="168" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">a memória</text><text x="740" y="208" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Acesso autorizado</text></g><g class="node" id="nossa-camada-shared-wiki" data-key="shared-wiki" tabindex="0" role="button" aria-label="Retomar o trabalho"><title>A próxima sessão consulta o que ficou salvo e confere as pendências antes de continuar.</title><rect x="40" y="344" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="380" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Retomar o trabalho</text><text x="60" y="448" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Decisões e próximos passos</text></g><g class="node" id="nossa-camada-operations" data-key="operations" tabindex="0" role="button" aria-label="Project Brain"><title>Após instalar e validar, diga encerrar sessão para guardar decisões e preparar a continuidade.</title><rect x="380" y="344" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="400" y="380" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Project Brain</text><text x="400" y="448" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Fechar e salvar o essencial</text></g><g class="node" id="nossa-camada-server" data-key="server" tabindex="0" role="button" aria-label="Servidor da pessoa ou empresa"><title>O servidor é administrado pela pessoa ou empresa; o AI Memory mantém os registros autorizados.</title><rect x="720" y="344" width="280" height="128" rx="8" fill="#172b40" stroke="#4A90D9" stroke-width="2"/><text x="740" y="380" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Servidor da pessoa</text><text x="740" y="408" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">ou empresa</text><text x="740" y="448" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Memória do trabalho</text></g><path d="M40 552H1000" stroke="#435469"/><text id="detail" x="40" y="588" fill="#d6e2ed" font-family="Segoe UI, sans-serif" font-size="20"><tspan id="detail-line-1" x="40" y="588">O fechamento prepara a continuidade; a próxima sessão confere o que ficou salvo.</tspan><tspan id="detail-line-2" x="40" y="616"></tspan></text></svg><script>const details={"rules": ["As instruções orientam a ferramenta a consultar a memória e guardar o que precisa", "permanecer."], "codex": ["A pessoa usa a ferramenta que está conectada e autorizada a acessar a memória."], "bridge": ["A conexão liga a ferramenta ao servidor escolhido, respeitando o acesso configurado."], "shared-wiki": ["A próxima sessão consulta o que ficou salvo e confere as pendências antes de continuar."], "operations": ["Após instalar e validar, diga encerrar sessão para guardar decisões e preparar a", "continuidade."], "server": ["O servidor é administrado pela pessoa ou empresa; o AI Memory mantém os registros", "autorizados."]};const nodes=[...document.querySelectorAll("g.node")];function focusNode(n){nodes.forEach(x=>x.classList.toggle("active",x===n));const lines=details[n.dataset.key];document.getElementById("detail-line-1").textContent=lines[0]||"";document.getElementById("detail-line-2").textContent=lines[1]||"";document.querySelectorAll("path[data-from]").forEach(e=>e.classList.toggle("lit",e.dataset.from===n.dataset.key||e.dataset.to===n.dataset.key));}nodes.forEach(n=>{n.addEventListener("mouseenter",()=>focusNode(n));n.addEventListener("focus",()=>focusNode(n));n.addEventListener("click",()=>focusNode(n));n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();focusNode(n);}})});</script></body></html>
