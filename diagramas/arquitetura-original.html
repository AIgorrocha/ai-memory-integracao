<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Memory original, v3.2.0</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;overflow:hidden;margin:0;background:#0f151d;color:#fff;font-family:"Segoe UI",sans-serif}svg{display:block;width:100%;height:100%}g.node{cursor:pointer}g.node:hover rect,g.node:focus rect,g.node.active rect{stroke:#4A90D9;stroke-width:4}g.node:focus{outline:none}path[data-from].lit{stroke:#4A90D9;stroke-width:4}@media(prefers-reduced-motion:reduce){*{transition:none}}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="arquitetura-original-title arquitetura-original-desc"><title id="arquitetura-original-title">AI Memory original, v3.2.0</title><desc id="arquitetura-original-desc">Ferramentas MCP, captura por hooks e CLI integram wiki Markdown e índice SQLite no original Rust.</desc><defs><marker id="arquitetura-original-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#91a5ba"/></marker></defs><rect width="1040" height="640" fill="#0f151d"/><path data-from="cli" data-to="mcp" d="M304 100H368" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="mcp" data-to="index" d="M632 100H696" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="cli" data-to="hooks" d="M172 144V248" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="hooks" data-to="core" d="M304 292H368" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="mcp" data-to="core" d="M500 144V248" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="consolidation" data-to="providers" d="M368 484H304" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="consolidation" data-to="wiki" d="M632 484H656Q664 484 664 476V300Q664 292 672 292H696" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="mcp" data-to="wiki" d="M632 120H640Q648 120 648 128V264Q648 272 656 272H696" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><g class="node" id="arquitetura-original-cli" data-key="cli" tabindex="0" role="button" aria-label="CLI e servidor"><title>Entrada do binário Rust, comandos e inicialização dos transportes.</title><rect x="40" y="56" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="92" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">CLI e servidor</text><text x="60" y="120" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Binário Rust</text></g><g class="node" id="arquitetura-original-mcp" data-key="mcp" tabindex="0" role="button" aria-label="Ferramentas MCP"><title>Expõe consulta, leitura e operações de memória para clientes compatíveis. O suporte do cliente e seu escopo são configurados separadamente.</title><rect x="368" y="56" width="264" height="88" rx="8" fill="#172b40" stroke="#4A90D9" stroke-width="2"/><text x="388" y="92" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Ferramentas MCP</text><text x="388" y="120" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Busca e leitura</text></g><g class="node" id="arquitetura-original-index" data-key="index" tabindex="0" role="button" aria-label="SQLite"><title>Índice de recuperação, sessões, observações e handoffs. WAL e escritor único. A wiki é canônica para páginas; eventos não são uma transcrição completa.</title><rect x="696" y="56" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="716" y="92" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">SQLite</text><text x="716" y="120" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Índice derivado</text></g><g class="node" id="arquitetura-original-hooks" data-key="hooks" tabindex="0" role="button" aria-label="Hooks"><title>Recebe eventos de ciclo de vida, sanitiza e encaminha observações. A captura é limitada e não equivale a transcrição integral.</title><rect x="40" y="248" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="284" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Hooks</text><text x="60" y="312" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Captura de eventos</text></g><g class="node" id="arquitetura-original-core" data-key="core" tabindex="0" role="button" aria-label="Registros de memória"><title>Tipos, erros e identificadores compartilhados. Não executa entrada ou saída de dados.</title><rect x="368" y="248" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="388" y="284" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Registros de memória</text><text x="388" y="312" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Formato compartilhado</text></g><g class="node" id="arquitetura-original-wiki" data-key="wiki" tabindex="0" role="button" aria-label="Wiki Markdown"><title>Fonte canônica em páginas Markdown versionadas em Git. Gravações atômicas e reconciliação de alterações.</title><rect x="696" y="248" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="716" y="284" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Wiki Markdown</text><text x="716" y="312" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Páginas e Git</text></g><g class="node" id="arquitetura-original-providers" data-key="providers" tabindex="0" role="button" aria-label="Provedores opcionais"><title>Interfaces para LLM e embeddings. Vetores e consolidação generativa dependem da configuração. Sem promessa de economia ou qualidade automática.</title><rect x="40" y="440" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="476" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Provedores opcionais</text><text x="60" y="504" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">LLM e embeddings</text></g><g class="node" id="arquitetura-original-consolidation" data-key="consolidation" tabindex="0" role="button" aria-label="Consolidação"><title>Resumo de sessão por regras funciona sem LLM. Consolidação generativa depende de provedor configurado; não assumir que está ativa.</title><rect x="368" y="440" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="388" y="476" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Consolidação</text><text x="388" y="504" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Sessões em páginas</text></g><path d="M40 564H1000" stroke="#435469"/><text id="detail" x="40" y="600" fill="#d6e2ed" font-family="Segoe UI, sans-serif" font-size="20">Wiki Markdown canônica, índice SQLite derivado e provedores opcionais.</text></svg><script>const details={"cli": "CLI e servidor: Binário Rust.", "mcp": "Ferramentas MCP: Busca e leitura.", "index": "SQLite: Índice derivado.", "hooks": "Hooks: Captura de eventos.", "core": "Registros de memória: Formato compartilhado.", "wiki": "Wiki Markdown: Páginas e Git.", "providers": "Provedores opcionais: LLM e embeddings.", "consolidation": "Consolidação: Sessões em páginas."};const nodes=[...document.querySelectorAll("g.node")];function focusNode(n){nodes.forEach(x=>x.classList.toggle("active",x===n));document.getElementById("detail").textContent=details[n.dataset.key];document.querySelectorAll("path[data-from]").forEach(e=>e.classList.toggle("lit",e.dataset.from===n.dataset.key||e.dataset.to===n.dataset.key));}nodes.forEach(n=>{n.addEventListener("mouseenter",()=>focusNode(n));n.addEventListener("focus",()=>focusNode(n));n.addEventListener("click",()=>focusNode(n));n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();focusNode(n);}})});</script></body></html>
