<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Memory: guardar e retomar</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;width:100%;overflow:hidden;margin:0;background:#0f151d;color:#fff;font-family:"Segoe UI",sans-serif}svg{display:block;width:100%;height:100%}g.node{cursor:pointer}g.node:hover rect,g.node:focus rect,g.node.active rect{stroke:#4A90D9;stroke-width:4}g.node:focus{outline:none}path[data-from].lit{stroke:#4A90D9;stroke-width:4}@media(prefers-reduced-motion:reduce){*{transition:none}}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="arquitetura-original-title arquitetura-original-desc"><title id="arquitetura-original-title">AI Memory: guardar e retomar</title><desc id="arquitetura-original-desc">Uma ferramenta de IA guarda conhecimento na memória, encontra o que importa e ajuda a retomar o trabalho.</desc><defs><marker id="arquitetura-original-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#91a5ba"/></marker></defs><rect width="1040" height="640" fill="#0f151d"/><text x="40" y="40" fill="#fff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600">AI Memory: guardar e retomar</text><text x="40" y="72" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Projeto de código aberto de Fabio Akita</text><path data-from="cli" data-to="mcp" d="M320 168H380" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="mcp" data-to="wiki" d="M660 168H720" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="wiki" data-to="index" d="M860 232V344" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><path data-from="index" data-to="consolidation" d="M720 408H660" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#arquitetura-original-arrow)"/><g class="node" id="arquitetura-original-cli" data-key="cli" tabindex="0" role="button" aria-label="Ferramenta de IA"><title>A pessoa trabalha na ferramenta de IA e pede para consultar ou guardar informação.</title><rect x="40" y="104" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="140" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Ferramenta de IA</text><text x="60" y="208" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Conversa e trabalho</text></g><g class="node" id="arquitetura-original-mcp" data-key="mcp" tabindex="0" role="button" aria-label="AI Memory"><title>O AI Memory organiza o conhecimento que foi autorizado a guardar.</title><rect x="380" y="104" width="280" height="128" rx="8" fill="#172b40" stroke="#4A90D9" stroke-width="2"/><text x="400" y="140" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">AI Memory</text><text x="400" y="208" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Memória do trabalho</text></g><g class="node" id="arquitetura-original-wiki" data-key="wiki" tabindex="0" role="button" aria-label="Conhecimento salvo"><title>Decisões e aprendizados ficam ligados às suas fontes e datas.</title><rect x="720" y="104" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="740" y="140" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Conhecimento salvo</text><text x="740" y="208" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Decisões e aprendizados</text></g><g class="node" id="arquitetura-original-index" data-key="index" tabindex="0" role="button" aria-label="Encontrar o que importa"><title>A busca recupera registros relevantes; a fonte precisa ser conferida.</title><rect x="720" y="344" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="740" y="380" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Encontrar o que</text><text x="740" y="408" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">importa</text><text x="740" y="448" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Busca com contexto</text></g><g class="node" id="arquitetura-original-consolidation" data-key="consolidation" tabindex="0" role="button" aria-label="Retomar o trabalho"><title>Outra sessão ou ferramenta conectada pode recuperar o contexto e continuar o trabalho.</title><rect x="380" y="344" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="400" y="380" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Retomar o trabalho</text><text x="400" y="448" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Em outra sessão</text></g><path d="M40 552H1000" stroke="#435469"/><text id="detail" x="40" y="588" fill="#d6e2ed" font-family="Segoe UI, sans-serif" font-size="20"><tspan id="detail-line-1" x="40" y="588">Guardar o que importa, encontrar depois e continuar com contexto.</tspan><tspan id="detail-line-2" x="40" y="616"></tspan></text></svg><script>const details={"cli": ["A pessoa trabalha na ferramenta de IA e pede para consultar ou guardar informação."], "mcp": ["O AI Memory organiza o conhecimento que foi autorizado a guardar."], "wiki": ["Decisões e aprendizados ficam ligados às suas fontes e datas."], "index": ["A busca recupera registros relevantes; a fonte precisa ser conferida."], "consolidation": ["Outra sessão ou ferramenta conectada pode recuperar o contexto e continuar o trabalho."]};const nodes=[...document.querySelectorAll("g.node")];function focusNode(n){nodes.forEach(x=>x.classList.toggle("active",x===n));const lines=details[n.dataset.key];document.getElementById("detail-line-1").textContent=lines[0]||"";document.getElementById("detail-line-2").textContent=lines[1]||"";document.querySelectorAll("path[data-from]").forEach(e=>e.classList.toggle("lit",e.dataset.from===n.dataset.key||e.dataset.to===n.dataset.key));}nodes.forEach(n=>{n.addEventListener("mouseenter",()=>focusNode(n));n.addEventListener("focus",()=>focusNode(n));n.addEventListener("click",()=>focusNode(n));n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();focusNode(n);}})});</script></body></html>
