<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uma memória entre ferramentas</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;width:100%;overflow:hidden;margin:0;background:#0f151d;color:#fff;font-family:"Segoe UI",sans-serif}svg{display:block;width:100%;height:100%}g.node{cursor:pointer}g.node:hover rect,g.node:focus rect,g.node.active rect{stroke:#4A90D9;stroke-width:4}g.node:focus{outline:none}path[data-from].lit{stroke:#4A90D9;stroke-width:4}@media(prefers-reduced-motion:reduce){*{transition:none}}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="fluxo-mcp-title fluxo-mcp-desc"><title id="fluxo-mcp-title">Uma memória entre ferramentas</title><desc id="fluxo-mcp-desc">Codex e Claude Code acessam a memória no servidor da pessoa ou empresa.</desc><defs><marker id="fluxo-mcp-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#91a5ba"/></marker></defs><rect width="1040" height="640" fill="#0f151d"/><text x="40" y="40" fill="#fff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600">Uma memória entre ferramentas</text><text x="40" y="72" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">MCP: ligação entre a IA e a memória</text><path data-from="codex" data-to="mcp" d="M320 168H344Q352 168 352 176V260Q352 268 360 268H380" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#fluxo-mcp-arrow)"/><path data-from="claude" data-to="mcp" d="M320 408H336Q344 408 344 400V316Q344 308 352 308H380" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#fluxo-mcp-arrow)"/><path data-from="mcp" data-to="memoria" d="M660 288H720" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#fluxo-mcp-arrow)"/><g class="node" id="fluxo-mcp-codex" data-key="codex" tabindex="0" role="button" aria-label="Codex"><title>O Codex consulta e registra o que estiver autorizado na memória.</title><rect x="40" y="104" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="140" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Codex</text><text x="60" y="208" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Ferramenta de trabalho</text></g><g class="node" id="fluxo-mcp-claude" data-key="claude" tabindex="0" role="button" aria-label="Claude Code"><title>O Claude Code pode retomar informações da mesma memória, com acesso configurado.</title><rect x="40" y="344" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="380" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Claude Code</text><text x="60" y="448" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Ferramenta de trabalho</text></g><g class="node" id="fluxo-mcp-mcp" data-key="mcp" tabindex="0" role="button" aria-label="Ligação entre IA e memória"><title>A conexão permite levar o pedido à memória e trazer a informação encontrada.</title><rect x="380" y="224" width="280" height="128" rx="8" fill="#172b40" stroke="#4A90D9" stroke-width="2"/><text x="400" y="260" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Ligação entre IA</text><text x="400" y="288" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">e memória</text><text x="400" y="328" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">MCP</text></g><g class="node" id="fluxo-mcp-memoria" data-key="memoria" tabindex="0" role="button" aria-label="Servidor da pessoa ou empresa"><title>A pessoa ou empresa administra o servidor e decide quem pode acessar a memória.</title><rect x="720" y="224" width="280" height="128" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="740" y="260" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Servidor da pessoa</text><text x="740" y="288" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">ou empresa</text><text x="740" y="328" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">AI Memory</text></g><path d="M40 552H1000" stroke="#435469"/><text id="detail" x="40" y="588" fill="#d6e2ed" font-family="Segoe UI, sans-serif" font-size="20"><tspan id="detail-line-1" x="40" y="588">A informação fica na memória do trabalho e pode ser retomada em outra sessão.</tspan><tspan id="detail-line-2" x="40" y="616"></tspan></text></svg><script>const details={"codex": ["O Codex consulta e registra o que estiver autorizado na memória."], "claude": ["O Claude Code pode retomar informações da mesma memória, com acesso configurado."], "mcp": ["A conexão permite levar o pedido à memória e trazer a informação encontrada."], "memoria": ["A pessoa ou empresa administra o servidor e decide quem pode acessar a memória."]};const nodes=[...document.querySelectorAll("g.node")];function focusNode(n){nodes.forEach(x=>x.classList.toggle("active",x===n));const lines=details[n.dataset.key];document.getElementById("detail-line-1").textContent=lines[0]||"";document.getElementById("detail-line-2").textContent=lines[1]||"";document.querySelectorAll("path[data-from]").forEach(e=>e.classList.toggle("lit",e.dataset.from===n.dataset.key||e.dataset.to===n.dataset.key));}nodes.forEach(n=>{n.addEventListener("mouseenter",()=>focusNode(n));n.addEventListener("focus",()=>focusNode(n));n.addEventListener("click",()=>focusNode(n));n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();focusNode(n);}})});</script></body></html>
