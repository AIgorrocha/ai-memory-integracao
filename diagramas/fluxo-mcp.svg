<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="fluxo-mcp-title fluxo-mcp-desc"><title id="fluxo-mcp-title">MCP conecta clientes ao servidor</title><desc id="fluxo-mcp-desc">Codex e Claude Code consultam e registram no mesmo servidor AI Memory por MCP.</desc><defs><marker id="fluxo-mcp-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#91a5ba"/></marker></defs><rect width="1040" height="640" fill="#0f151d"/><path data-from="codex" data-to="mcp" d="M304 124H328Q336 124 336 132V284Q336 292 344 292H368" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#fluxo-mcp-arrow)"/><path data-from="claude" data-to="mcp" d="M304 460H320Q328 460 328 452V324Q328 316 336 316H368" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#fluxo-mcp-arrow)"/><path data-from="mcp" data-to="memoria" d="M632 292H696" fill="none" stroke="#91a5ba" stroke-width="2" marker-end="url(#fluxo-mcp-arrow)"/><g class="node" id="fluxo-mcp-codex" data-key="codex" tabindex="0" role="button" aria-label="Codex"><rect x="40" y="80" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="116" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Codex</text><text x="60" y="144" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Cliente autorizado</text></g><g class="node" id="fluxo-mcp-mcp" data-key="mcp" tabindex="0" role="button" aria-label="MCP"><rect x="368" y="248" width="264" height="88" rx="8" fill="#172b40" stroke="#4A90D9" stroke-width="2"/><text x="388" y="284" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">MCP</text><text x="388" y="312" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Protocolo de conexão</text></g><g class="node" id="fluxo-mcp-claude" data-key="claude" tabindex="0" role="button" aria-label="Claude Code"><rect x="40" y="416" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="60" y="452" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Claude Code</text><text x="60" y="480" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Cliente autorizado</text></g><g class="node" id="fluxo-mcp-memoria" data-key="memoria" tabindex="0" role="button" aria-label="AI Memory"><rect x="696" y="248" width="264" height="88" rx="8" fill="#18212c" stroke="#60748a" stroke-width="2"/><text x="716" y="284" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">AI Memory</text><text x="716" y="312" fill="#bac8d6" font-family="Segoe UI, sans-serif" font-size="20">Servidor compartilhado</text></g><path d="M40 564H1000" stroke="#435469"/><text id="detail" x="40" y="600" fill="#d6e2ed" font-family="Segoe UI, sans-serif" font-size="20">Ferramentas autorizadas compartilham a base, preservando o escopo de cada consulta.</text></svg>